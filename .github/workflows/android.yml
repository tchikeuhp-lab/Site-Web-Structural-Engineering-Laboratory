name: Android

# APK de test à chaque push / PR ; APK + AAB signés sur un tag v* (ou à la demande).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # nécessaire uniquement pour publier la release sur un tag

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Racine de l'application : "." dans un dépôt dédié, "arpentis" si elle vit dans un sous-dossier
      APP_DIR: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Dépendances, tests et build web (mode android)
        working-directory: ${{ env.APP_DIR }}
        run: |
          npm ci
          npm test
          npm run android:sync

      - name: Version
        id: ver
        working-directory: ${{ env.APP_DIR }}
        run: |
          echo "name=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: APK de test (debug)
        working-directory: ${{ env.APP_DIR }}/android
        run: |
          set +e
          ./gradlew --no-daemon assembleDebug -PappVersionCode=${{ steps.ver.outputs.code }} -PappVersionName=${{ steps.ver.outputs.name }} 2>&1 | tee "$RUNNER_TEMP/gradle.log"
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            # Résumé de l'erreur en annotation (lisible sans télécharger les journaux)
            msg=$(grep -E -B1 -A8 "What went wrong|error:|FAILED" "$RUNNER_TEMP/gradle.log" | head -40 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Echec Gradle::$msg"
          fi
          exit $rc

      - uses: actions/upload-artifact@v4
        with:
          name: arpentis-debug-apk
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # ---- Release signée : uniquement si les secrets de signature sont définis ----
      - name: Secrets de signature présents ?
        id: sign
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ] && [ "${{ github.event_name }}" != "pull_request" ]; then echo "available=true" >> "$GITHUB_OUTPUT"; else echo "available=false" >> "$GITHUB_OUTPUT"; fi

      - name: APK + AAB de release signés
        if: steps.sign.outputs.available == 'true' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        working-directory: ${{ env.APP_DIR }}/android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ARPENTIS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ARPENTIS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ARPENTIS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/arpentis.jks"
          export ARPENTIS_KEYSTORE_FILE="$RUNNER_TEMP/arpentis.jks"
          ./gradlew --no-daemon assembleRelease bundleRelease -PappVersionCode=${{ steps.ver.outputs.code }} -PappVersionName=${{ steps.ver.outputs.name }}
          rm -f "$RUNNER_TEMP/arpentis.jks"

      - uses: actions/upload-artifact@v4
        if: steps.sign.outputs.available == 'true' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        with:
          name: arpentis-release
          path: |
            ${{ env.APP_DIR }}/android/app/build/outputs/apk/release/*.apk
            ${{ env.APP_DIR }}/android/app/build/outputs/bundle/release/*.aab

      - name: Publier la release GitHub
        if: steps.sign.outputs.available == 'true' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.APP_DIR }}/android/app/build/outputs/apk/release/*.apk
            ${{ env.APP_DIR }}/android/app/build/outputs/bundle/release/*.aab
          generate_release_notes: true
