<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="poly" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.15" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.4" />
    </pattern>
  </defs>
  
  <!-- Base Background -->
  <rect width="512" height="512" rx="104" fill="url(#bg)" />
  <rect width="512" height="512" rx="104" fill="url(#grid)" />
  
  <!-- Outer Technical Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#059669" stroke-width="3" stroke-dasharray="8 6" stroke-opacity="0.4" />
  <circle cx="256" cy="256" r="180" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" />
  
  <!-- Compass / Crosshair Axes -->
  <line x1="256" y1="36" x2="256" y2="476" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 4" />
  <line x1="36" y1="256" x2="476" y2="256" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 4" />
  
  <!-- Surveyed Polygon Area -->
  <polygon points="120,180 280,100 410,210 350,390 160,370" fill="url(#poly)" stroke="#10b981" stroke-width="6" stroke-linejoin="round" />
  
  <!-- Polygon Inner Triangulation Construction Lines -->
  <line x1="120" y1="180" x2="410" y2="210" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 4" stroke-opacity="0.6" />
  <line x1="120" y1="180" x2="350" y2="390" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 4" stroke-opacity="0.6" />
  
  <!-- Boundary Stones (Bornes) with Target Rings -->
  <!-- Borne 1 -->
  <circle cx="120" cy="180" r="16" fill="#0f172a" stroke="#10b981" stroke-width="4" />
  <circle cx="120" cy="180" r="6" fill="#34d399" />
  <!-- Borne 2 -->
  <circle cx="280" cy="100" r="16" fill="#0f172a" stroke="#10b981" stroke-width="4" />
  <circle cx="280" cy="100" r="6" fill="#34d399" />
  <!-- Borne 3 -->
  <circle cx="410" cy="210" r="16" fill="#0f172a" stroke="#10b981" stroke-width="4" />
  <circle cx="410" cy="210" r="6" fill="#34d399" />
  <!-- Borne 4 -->
  <circle cx="350" cy="390" r="16" fill="#0f172a" stroke="#10b981" stroke-width="4" />
  <circle cx="350" cy="390" r="6" fill="#34d399" />
  <!-- Borne 5 -->
  <circle cx="160" cy="370" r="16" fill="#0f172a" stroke="#10b981" stroke-width="4" />
  <circle cx="160" cy="370" r="6" fill="#34d399" />
  
  <!-- Centroid Pin -->
  <circle cx="264" cy="250" r="9" fill="#f59e0b" />
  <circle cx="264" cy="250" r="18" fill="none" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.6" />
</svg>
